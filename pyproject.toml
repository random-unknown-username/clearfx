[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clearfx"
version = "0.2.6"
description = "Replace terminal clear with stunning animations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Satvik Hardat", email = "satvikhardat@gmail.com" },
]
keywords = ["terminal", "animation", "clear", "tui", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
    "Topic :: Artistic Software",
    "Typing :: Typed",
]
dependencies = [
    "platformdirs>=4.0",
    "wcwidth>=0.2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5.0",
    "mypy>=1.8",
    "pre-commit>=3.0",
]
marketplace-server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.7",
    "jinja2>=3.1",
    "aiofiles>=23.0",
    "pydantic>=2.0",
    "httpx>=0.27",
]
recording = [
    "Pillow>=10.0",
]
client = [
    "httpx>=0.27",
]

[project.scripts]
clearfx = "clearfx.cli.main:main"

[project.urls]
Homepage = "https://github.com/random-unknown-username/clearfx"
Repository = "https://github.com/random-unknown-username/clearfx"
Issues = "https://github.com/random-unknown-username/clearfx/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/clearfx"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["clearfx"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "wcwidth.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "security: marks security tests",
    "golden: marks golden-frame tests",
    "benchmark: marks benchmark tests",
]
